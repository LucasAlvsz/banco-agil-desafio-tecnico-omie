[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banco-agil"
version = "0.1.0"
description = "Sistema multiagente de atendimento bancário digital (Banco Ágil)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langchain-core>=0.3.0",
    "langchain-litellm>=0.2.0",
    "langgraph>=1.0.0",
    "litellm>=1.60.0",
    "streamlit>=1.42.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pre-commit>=4.1.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/banco_agil"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["banco_agil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
